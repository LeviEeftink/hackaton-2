name: HitchTracker CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYLOAD_SECRET: hitchtracker-ci-synthetic-secret-at-least-32-characters
      DATABASE_URL: file:./ci.db
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Payload files
        run: |
          npm run generate:importmap
          npm run generate:types
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Seed CI database
        run: npm run seed
      - name: Production build
        run: npm run build
      - name: Live API integration
        env:
          HOSTNAME: '127.0.0.1'
          PORT: '3000'
          TEST_BASE_URL: http://localhost:3000
        run: |
          node scripts/start.mjs > /tmp/hitchtracker.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! npm run test:api; then
            cat /tmp/hitchtracker.log
            exit 1
          fi
